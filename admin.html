<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#120b12">

    <title>Lili • Cevap Paneli</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 20% 10%, rgba(255, 103, 150, .12), transparent 35%),
                radial-gradient(circle at 80% 90%, rgba(255, 150, 180, .07), transparent 35%),
                linear-gradient(145deg, #090709, #160b11 55%, #0b080a);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 650px;

            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.09);

            border-radius: 28px;
            padding: 38px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px rgba(0,0,0,.45);
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 32px;
        }

        .title-area h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .title-area p {
            color: rgba(255,255,255,.45);
            font-size: 14px;
        }

        .logo {
            width: 55px;
            height: 55px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.08);

            font-size: 25px;
        }

        .status-card {
            padding: 27px;

            border-radius: 20px;

            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.07);

            margin-bottom: 15px;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;

            color: rgba(255,255,255,.35);

            margin-bottom: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 11px;

            font-size: 23px;
            font-weight: 700;
        }

        .dot {
            width: 11px;
            height: 11px;

            border-radius: 50%;

            background: #8b8b8b;

            box-shadow:
                0 0 14px rgba(139,139,139,.5);
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 15px;
            margin-top: 15px;
        }

        .detail-card {
            padding: 21px;

            border-radius: 18px;

            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.06);
        }

        .detail-title {
            font-size: 12px;

            color: rgba(255,255,255,.35);

            margin-bottom: 9px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;

            color: rgba(255,255,255,.82);
        }

        .refresh {
            width: 100%;
            min-height: 50px;

            margin-top: 22px;

            border: none;
            border-radius: 15px;

            color: white;

            font-family: inherit;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #e94d79,
                    #ff769b
                );

            box-shadow:
                0 10px 25px rgba(233,77,121,.2);

            transition: .2s;
        }

        .refresh:hover {
            transform: translateY(-2px);
        }

        .bottom-text {
            margin-top: 18px;

            text-align: center;

            color: rgba(255,255,255,.25);

            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            body {
                padding: 13px;
            }

            .panel {
                padding: 27px 19px;
                border-radius: 23px;
            }

            .title-area h1 {
                font-size: 23px;
            }

            .status {
                font-size: 20px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .status-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="panel">

        <div class="top">

            <div class="title-area">
                <h1>Lili • Cevap Paneli</h1>
                <p>Özür sayfası cevap durumu</p>
            </div>

            <div class="logo">
                🤍
            </div>

        </div>


        <section class="status-card">

            <div class="label">
                Güncel Durum
            </div>

            <div class="status">

                <div
                    class="dot"
                    id="statusDot"
                ></div>

                <span id="statusText">
                    Henüz cevap vermedi
                </span>

            </div>

        </section>


        <div class="details">

            <div class="detail-card">

                <div class="detail-title">
                    Cevap
                </div>

                <div
                    class="detail-value"
                    id="answerText"
                >
                    —
                </div>

            </div>


            <div class="detail-card">

                <div class="detail-title">
                    Cevap Tarihi
                </div>

                <div
                    class="detail-value"
                    id="answerDate"
                >
                    —
                </div>

            </div>

        </div>


        <button
            class="refresh"
            onclick="loadAnswer()"
        >
            ↻ Cevabı Yenile
        </button>


        <div class="bottom-text">
            LILI • PRIVATE PANEL
        </div>

    </main>


    <script>

    async function loadAnswer() {

        const statusText =
            document.getElementById("statusText");

        const statusDot =
            document.getElementById("statusDot");

        const answerText =
            document.getElementById("answerText");

        const answerDate =
            document.getElementById("answerDate");


        try {

            const response =
                await fetch("/api/answer");


            if (!response.ok) {
                throw new Error("Sunucu hatası");
            }


            const data =
                await response.json();


            /* Henüz cevap yok */

            if (!data.answer) {

                statusText.innerText =
                    "Henüz cevap vermedi";

                answerText.innerText =
                    "—";

                answerDate.innerText =
                    "—";

                statusDot.style.background =
                    "#8b8b8b";

                statusDot.style.boxShadow =
                    "0 0 14px rgba(139,139,139,.5)";

                return;
            }


            /* AFFETTİ */

            if (data.answer === "forgiven") {

                statusText.innerText =
                    "Affetti 🤍";

                answerText.innerText =
                    "AFFETTİ";

                statusDot.style.background =
                    "#54d68c";

                statusDot.style.boxShadow =
                    "0 0 16px rgba(84,214,140,.6)";
            }


            /* HALA KIRGIN */

            if (data.answer === "upset") {

                statusText.innerText =
                    "Biraz kırgın";

                answerText.innerText =
                    "BİRAZ KIRGIN";

                statusDot.style.background =
                    "#ffad5c";

                statusDot.style.boxShadow =
                    "0 0 16px rgba(255,173,92,.6)";
            }


            /* Tarih */

            if (data.date) {

                const date =
                    new Date(data.date);


                answerDate.innerText =
                    date.toLocaleString(
                        "tr-TR",
                        {
                            dateStyle: "medium",
                            timeStyle: "medium"
                        }
                    );

            } else {

                answerDate.innerText =
                    "—";
            }


        } catch (error) {

            console.error(error);

            statusText.innerText =
                "Sunucuya bağlanılamadı";

            answerText.innerText =
                "HATA";

            answerDate.innerText =
                "—";

            statusDot.style.background =
                "#ff5c5c";

            statusDot.style.boxShadow =
                "0 0 16px rgba(255,92,92,.6)";
        }

    }


    /* Sayfa açılınca otomatik getir */

    loadAnswer();


    /* Her 5 saniyede otomatik kontrol et */

    setInterval(
        loadAnswer,
        5000
    );

</script>

</body>
</html>
